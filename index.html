<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MoneyGator — Board</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0F172A;
    --surface: #1E293B;
    --surface2: #263348;
    --border: #2E3F58;
    --accent: #5B4FE8;
    --accent-soft: rgba(91,79,232,0.15);
    --green: #22C55E;
    --red: #EF4444;
    --orange: #F59E0B;
    --cyan: #A5F3FC;
    --text: #F1F5F9;
    --text-muted: #64748B;
    --text-dim: #94A3B8;
    --radius: 12px;
    --radius-sm: 8px;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }

  /* LOGIN */
  #login-screen {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 24px;
  }

  .login-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 48px 40px;
    width: 100%;
    max-width: 380px;
    text-align: center;
  }

  .login-logo { font-size: 32px; margin-bottom: 8px; }
  .login-title { font-size: 22px; font-weight: 700; margin-bottom: 4px; }
  .login-sub { font-size: 14px; color: var(--text-muted); margin-bottom: 36px; }

  .login-input {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 14px 16px;
    font-size: 15px;
    color: var(--text);
    outline: none;
    margin-bottom: 12px;
    transition: border-color 0.2s;
    letter-spacing: 2px;
  }

  .login-input:focus { border-color: var(--accent); }

  .login-btn {
    width: 100%;
    background: var(--accent);
    color: white;
    border: none;
    border-radius: var(--radius-sm);
    padding: 14px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: opacity 0.2s;
  }

  .login-btn:hover { opacity: 0.88; }
  .login-error { color: var(--red); font-size: 13px; margin-top: 10px; display: none; }

  /* APP */
  #app { display: none; }

  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 24px;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
    position: sticky;
    top: 0;
    z-index: 10;
    flex-wrap: wrap;
    gap: 12px;
  }

  .topbar-left { display: flex; align-items: center; gap: 10px; }
  .topbar-logo { font-size: 22px; }
  .topbar-name { font-size: 16px; font-weight: 700; }

  .topbar-tag {
    font-size: 11px;
    background: var(--accent-soft);
    color: var(--cyan);
    border: 1px solid rgba(165,243,252,0.2);
    padding: 3px 10px;
    border-radius: 20px;
    font-weight: 500;
  }

  .topbar-right { display: flex; align-items: center; gap: 12px; }

  .add-task-btn {
    background: var(--accent);
    color: white;
    border: none;
    border-radius: var(--radius-sm);
    padding: 8px 16px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: opacity 0.2s;
  }

  .add-task-btn:hover { opacity: 0.88; }

  .logout-btn {
    background: none;
    border: 1px solid var(--border);
    color: var(--text-muted);
    border-radius: var(--radius-sm);
    padding: 8px 14px;
    font-size: 13px;
    cursor: pointer;
    transition: all 0.2s;
  }

  .logout-btn:hover { border-color: var(--text-muted); color: var(--text); }

  /* TABS */
  .tabs-bar {
    display: flex;
    gap: 8px;
    padding: 14px 24px 0 24px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
  }

  .tab-btn {
    background: none;
    border: none;
    color: var(--text-muted);
    font-size: 14px;
    font-weight: 600;
    padding: 10px 18px;
    cursor: pointer;
    border-bottom: 2px solid transparent;
    transition: all 0.2s;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .tab-btn:hover { color: var(--text); }

  .tab-btn.active {
    color: var(--text);
    border-bottom-color: var(--accent);
  }

  .tab-lock { font-size: 12px; opacity: 0.7; }

  /* BOARD */
  .board-view { display: none; }
  .board-view.active { display: block; }

  .board {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 16px;
    padding: 24px;
    min-height: calc(100vh - 118px);
  }

  .column {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px;
    min-height: 500px;
    display: flex;
    flex-direction: column;
  }

  .column.drag-over {
    border-color: var(--accent);
    background: var(--surface2);
  }

  .col-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 16px;
  }

  .col-title {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 13px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    color: var(--text-dim);
  }

  .col-dot { width: 8px; height: 8px; border-radius: 50%; }

  .col-count {
    font-size: 12px;
    color: var(--text-muted);
    background: var(--bg);
    border-radius: 20px;
    padding: 2px 8px;
    font-weight: 600;
  }

  .col-add {
    background: none;
    border: none;
    color: var(--text-muted);
    cursor: pointer;
    font-size: 18px;
    padding: 2px 6px;
    border-radius: 4px;
    transition: all 0.2s;
  }

  .col-add:hover { background: var(--bg); color: var(--text); }

  .cards { display: flex; flex-direction: column; gap: 10px; flex: 1; }

  /* CARDS */
  .card {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 14px;
    cursor: grab;
    transition: all 0.15s;
  }

  .card:hover { border-color: var(--accent); transform: translateY(-1px); }
  .card.dragging { opacity: 0.4; cursor: grabbing; }

  .card-top {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 8px;
    margin-bottom: 8px;
  }

  .card-tag {
    display: inline-block;
    font-size: 10px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    padding: 2px 8px;
    border-radius: 20px;
    white-space: nowrap;
  }

  .card-title {
    font-size: 14px;
    font-weight: 500;
    color: var(--text);
    line-height: 1.4;
    margin-bottom: 10px;
  }

  .card-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 6px;
  }

  .card-assignee {
    font-size: 11px;
    color: var(--text-muted);
    display: flex;
    align-items: center;
    gap: 4px;
  }

  .avatar {
    width: 20px;
    height: 20px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 10px;
    font-weight: 700;
    flex-shrink: 0;
  }

  .avatar-p { background: var(--accent); color: white; }
  .avatar-t { background: var(--green); color: #0F172A; }
  .avatar-b { background: var(--orange); color: #0F172A; }

  /* DEADLINE */
  .deadline {
    display: flex;
    align-items: center;
    gap: 4px;
    font-size: 11px;
    font-weight: 500;
    padding: 2px 8px;
    border-radius: 20px;
    white-space: nowrap;
  }

  .deadline-overdue { background: rgba(239,68,68,0.15); color: #FCA5A5; }
  .deadline-soon    { background: rgba(245,158,11,0.15); color: #FCD34D; }
  .deadline-ok      { background: rgba(34,197,94,0.12);  color: #86EFAC; }

  .card-actions { display: flex; align-items: center; gap: 4px; }

  .card-btn {
    background: none;
    border: none;
    color: var(--text-muted);
    cursor: pointer;
    font-size: 13px;
    padding: 3px 5px;
    border-radius: 4px;
    opacity: 0;
    transition: all 0.15s;
    line-height: 1;
  }

  .card:hover .card-btn { opacity: 1; }
  .card-btn:hover { background: var(--surface); color: var(--text); }
  .card-btn.delete:hover { color: var(--red); background: rgba(239,68,68,0.1); }

  /* MODAL */
  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.7);
    z-index: 100;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }

  .modal-overlay.open { display: flex; }

  .modal {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 28px;
    width: 100%;
    max-width: 440px;
  }

  .modal-title { font-size: 17px; font-weight: 700; margin-bottom: 20px; }

  .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

  .form-group { margin-bottom: 14px; }

  .form-label {
    display: block;
    font-size: 12px;
    font-weight: 600;
    color: var(--text-dim);
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-bottom: 6px;
  }

  .form-input, .form-select {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 11px 14px;
    font-size: 14px;
    color: var(--text);
    outline: none;
    transition: border-color 0.2s;
    font-family: inherit;
  }

  .form-input:focus, .form-select:focus { border-color: var(--accent); }
  .form-select option { background: var(--surface); }

  input[type="date"]::-webkit-calendar-picker-indicator {
    filter: invert(0.5);
    cursor: pointer;
  }

  .modal-actions { display: flex; gap: 10px; margin-top: 20px; }

  .btn-primary {
    flex: 1;
    background: var(--accent);
    color: white;
    border: none;
    border-radius: var(--radius-sm);
    padding: 12px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: opacity 0.2s;
  }

  .btn-primary:hover { opacity: 0.88; }

  .btn-secondary {
    background: none;
    border: 1px solid var(--border);
    color: var(--text-dim);
    border-radius: var(--radius-sm);
    padding: 12px 20px;
    font-size: 14px;
    cursor: pointer;
    transition: all 0.2s;
  }

  .btn-secondary:hover { border-color: var(--text-muted); color: var(--text); }


  /* SYNC */
  .sync-badge {
    font-size: 11px;
    padding: 4px 10px;
    border-radius: 20px;
    border: 1px solid var(--border);
    color: var(--text-muted);
    display: flex; align-items: center; gap: 6px;
    white-space: nowrap;
  }
  .sync-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--text-muted); }
  .sync-badge.ok .sync-dot { background: var(--green); }
  .sync-badge.saving .sync-dot { background: var(--orange); animation: pulse 1s infinite; }
  .sync-badge.err .sync-dot { background: var(--red); }
  .sync-badge.err { color: #FCA5A5; border-color: rgba(239,68,68,0.4); cursor: pointer; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.3} }

  .token-hint { font-size: 12px; color: var(--text-muted); line-height: 1.5; margin-top: 8px; }
  .token-hint a { color: var(--cyan); }

  /* TAGS */
  .tag-product   { background: rgba(91,79,232,0.2);  color: #A78BFA; }
  .tag-dev       { background: rgba(165,243,252,0.15);color: var(--cyan); }
  .tag-design    { background: rgba(249,115,22,0.2);  color: #FB923C; }
  .tag-bizdev    { background: rgba(34,197,94,0.2);   color: var(--green); }
  .tag-marketing { background: rgba(245,158,11,0.2);  color: var(--orange); }
  .tag-legal     { background: rgba(239,68,68,0.2);   color: #FCA5A5; }
  .tag-finance   { background: rgba(168,85,247,0.2);  color: #D8B4FE; }
  .tag-strategy  { background: rgba(236,72,153,0.2);  color: #F9A8D4; }

  @media (max-width: 900px) { .board { grid-template-columns: repeat(2, 1fr); } }
  @media (max-width: 540px) {
    .board { grid-template-columns: 1fr; padding: 16px; }
    .topbar { padding: 12px 16px; }
    .topbar-tag { display: none; }
    .form-row { grid-template-columns: 1fr; }
    .tabs-bar { padding: 12px 16px 0 16px; }
  }
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login-screen">
  <div class="login-card">
    <div class="login-logo">🐊</div>
    <div class="login-title">MoneyGator Board</div>
    <div class="login-sub">Enter password to access</div>
    <input type="password" class="login-input" id="pwd-input" placeholder="Password"
      onkeydown="if(event.key==='Enter')doLogin()">
    <button class="login-btn" onclick="doLogin()">Enter</button>
    <div class="login-error" id="login-error">Wrong password. Try again.</div>
  </div>
</div>

<!-- APP -->
<div id="app">
  <div class="topbar">
    <div class="topbar-left">
      <span class="topbar-logo">🐊</span>
      <span class="topbar-name">MoneyGator</span>
      <span class="topbar-tag">Team Board</span>
    </div>
    <div class="topbar-right">
      <div class="sync-badge" id="sync-badge" title="board v4" onclick="onSyncBadgeClick()"><span class="sync-dot"></span><span id="sync-text">Connecting…</span></div>
      <button class="add-task-btn" onclick="openModal()">+ Add task</button>
      <button class="logout-btn" onclick="doLogout()">Log out</button>
    </div>
  </div>

  <div class="tabs-bar">
    <button class="tab-btn active" id="tab-general" onclick="switchTab('general')">General</button>
    <button class="tab-btn" id="tab-founders" onclick="switchTab('founders')">
      Founders Level <span class="tab-lock">🔒</span>
    </button>
  </div>

  <div class="board-view active" id="view-general">
    <div class="board" id="board-general"></div>
  </div>

  <div class="board-view" id="view-founders">
    <div class="board" id="board-founders"></div>
  </div>
</div>

<!-- TOKEN MODAL -->
<div class="modal-overlay" id="token-modal">
  <div class="modal">
    <div class="modal-title">Connect shared storage</div>
    <div class="form-group">
      <label class="form-label">GitHub token</label>
      <input type="password" class="form-input" id="f-token" placeholder="ghp_…"
        onkeydown="if(event.key==='Enter')saveToken()">
      <div class="token-hint">
        Tasks are stored in the GitHub repo so you and Tanya see the same board.
        Paste the token Pavel shared. It is saved only in this browser.
      </div>
    </div>
    <div class="modal-actions">
      <button class="btn-primary" onclick="saveToken()">Connect</button>
    </div>
  </div>
</div>

<!-- MODAL -->
<div class="modal-overlay" id="modal" onclick="if(event.target===this)closeModal()">
  <div class="modal">
    <div class="modal-title" id="modal-title">New task</div>

    <div class="form-group">
      <label class="form-label">Title</label>
      <input type="text" class="form-input" id="f-title" placeholder="What needs to be done?">
    </div>

    <div class="form-row">
      <div class="form-group">
        <label class="form-label">Column</label>
        <select class="form-select" id="f-col">
          <option value="backlog">Backlog</option>
          <option value="todo">To Do</option>
          <option value="inprogress">In Progress</option>
          <option value="done">Done</option>
        </select>
      </div>
      <div class="form-group">
        <label class="form-label">Deadline</label>
        <input type="date" class="form-input" id="f-deadline">
      </div>
    </div>

    <div class="form-row">
      <div class="form-group">
        <label class="form-label">Area</label>
        <select class="form-select" id="f-tag">
          <option value="product">Product</option>
          <option value="dev">Dev</option>
          <option value="design">Design</option>
          <option value="bizdev">Biz Dev</option>
          <option value="marketing">Marketing</option>
          <option value="legal">Legal</option>
          <option value="finance">Finance</option>
          <option value="strategy">Strategy</option>
        </select>
      </div>
      <div class="form-group">
        <label class="form-label">Assignee</label>
        <select class="form-select" id="f-assignee">
          <option value="P">Pavel</option>
          <option value="T">Tanya</option>
          <option value="B">Both</option>
        </select>
      </div>
    </div>

    <div class="modal-actions">
      <button class="btn-secondary" onclick="closeModal()">Cancel</button>
      <button class="btn-primary" id="modal-save-btn" onclick="saveTask()">Add task</button>
    </div>
  </div>
</div>

<script>
  const PASSWORD = 'moneygator2026';
  const COLUMNS = ['backlog','todo','inprogress','done'];
  const COLUMN_META = {
    backlog:    { label: 'Backlog',     dot: '#64748B' },
    todo:       { label: 'To Do',       dot: '#F59E0B' },
    inprogress: { label: 'In Progress', dot: '#5B4FE8' },
    done:       { label: 'Done',        dot: '#22C55E' },
  };

  let boards = { general: [], founders: [] };
  let currentTab = 'general';
  let dragId = null;
  let editId = null;

  // AUTH
  const LOGIN_TTL_MS = 30 * 24 * 60 * 60 * 1000;

  function enterApp() {
    document.getElementById('login-screen').style.display = 'none';
    document.getElementById('app').style.display = 'block';
    loadBoards();
  }

  function doLogin() {
    if (document.getElementById('pwd-input').value === PASSWORD) {
      localStorage.setItem('mg_login_until', String(Date.now() + LOGIN_TTL_MS));
      enterApp();
    } else {
      document.getElementById('login-error').style.display = 'block';
      document.getElementById('pwd-input').value = '';
    }
  }

  function doLogout() {
    localStorage.removeItem('mg_login_until');
    clearInterval(pollTimer);
    document.getElementById('login-screen').style.display = 'flex';
    document.getElementById('app').style.display = 'none';
    document.getElementById('pwd-input').value = '';
  }

  // TABS
  function switchTab(tab) {
    currentTab = tab;
    document.getElementById('tab-general').classList.toggle('active', tab === 'general');
    document.getElementById('tab-founders').classList.toggle('active', tab === 'founders');
    document.getElementById('view-general').classList.toggle('active', tab === 'general');
    document.getElementById('view-founders').classList.toggle('active', tab === 'founders');
  }

  // ─── SHARED STORAGE (GitHub repo file) ─────────────────────────────────────
  const GH_OWNER = 'Palgrich';
  const GH_REPO  = 'moneygator-board';
  const GH_PATH  = 'data/board.json';
  const GH_API   = `https://api.github.com/repos/${GH_OWNER}/${GH_REPO}/contents/${GH_PATH}`;
  const POLL_MS  = 20000;

  let remoteSha = null;
  let saveTimer = null;
  let pollTimer = null;
  let isSaving  = false;
  let dirty     = false;

  function ghToken() { return localStorage.getItem('mg_gh_token') || ''; }
  function ghHeaders() {
    const h = { 'Accept': 'application/vnd.github+json' };
    const t = ghToken();
    if (t) h['Authorization'] = 'token ' + t;
    return h;
  }

  function setSync(state, text) {
    const b = document.getElementById('sync-badge');
    b.className = 'sync-badge ' + state;
    document.getElementById('sync-text').textContent = text;
  }

  function onSyncBadgeClick() {
    const b = document.getElementById('sync-badge');
    if (!b.classList.contains('err')) return;
    const txt = document.getElementById('sync-text').textContent || '';
    if (txt.startsWith('Token') || txt.startsWith('Not connected')) {
      localStorage.removeItem('mg_gh_token');
      document.getElementById('f-token').value = '';
      document.getElementById('token-modal').classList.add('open');
    } else {
      dirty = true; setSync('saving', 'Retrying…'); flushSave();
    }
  }

  function saveToken() {
    const t = document.getElementById('f-token').value.replace(/\s+/g, '');
    if (!t) return;
    localStorage.setItem('mg_gh_token', t);
    document.getElementById('token-modal').classList.remove('open');
    loadBoards();
  }

  // b64 helpers that survive unicode (emoji, arrows)
  const enc = (s) => btoa(unescape(encodeURIComponent(s)));
  const dec = (s) => decodeURIComponent(escape(atob(s.replace(/\n/g, ''))));

  async function fetchRemote() {
    const r = await fetch(GH_API + '?t=' + Date.now(), { headers: ghHeaders(), cache: 'no-store' });
    if (r.status === 404) return { boards: null, sha: null };
    if (r.status === 401 || r.status === 403) throw new Error('auth');
    if (!r.ok) throw new Error('http ' + r.status);
    const j = await r.json();
    return { boards: JSON.parse(dec(j.content)), sha: j.sha };
  }

  async function pushRemote(payload, sha) {
    const body = { message: 'board: update', content: enc(JSON.stringify(payload, null, 2)) };
    if (sha) body.sha = sha;
    let r;
    try {
      r = await fetch(GH_API, { method: 'PUT', headers: { ...ghHeaders(), 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
    } catch (netErr) {
      console.error('[board] PUT network error', netErr);
      throw new Error('network: ' + (netErr.message || 'blocked'));
    }
    if (r.status === 409) throw new Error('conflict');
    if (!r.ok) {
      let msg = '';
      try { msg = (await r.json()).message || ''; } catch {}
      console.error('[board] PUT failed', r.status, msg);
      if (r.status === 401 || r.status === 403) throw new Error('auth: ' + r.status + ' ' + msg);
      if (r.status === 422) throw new Error('conflict');
      throw new Error('http ' + r.status + ' ' + msg);
    }
    const j = await r.json();
    return j.content.sha;
  }

  // Public API used by the rest of the app
  function saveBoards() {
    localStorage.setItem('mg_boards_v1', JSON.stringify(boards)); // local cache
    localStorage.setItem('mg_pending', '1');                       // survives refresh if PUT fails
    dirty = true;
    setSync('saving', 'Saving…');
    clearTimeout(saveTimer);
    saveTimer = setTimeout(flushSave, 600);
  }

  async function flushSave() {
    if (isSaving) { saveTimer = setTimeout(flushSave, 300); return; }
    if (!dirty) return;
    isSaving = true;
    try {
      if (!remoteSha) { const cur = await fetchRemote(); remoteSha = cur.sha; }
      remoteSha = await pushRemote(boards, remoteSha);
      dirty = false;
      localStorage.removeItem('mg_pending');
      setSync('ok', 'Saved');
    } catch (e) {
      console.error('[board] save failed:', e.message);
      if (e.message === 'conflict') {
        // someone else saved first: pull, merge our cards in, retry
        try {
          const { boards: rb, sha } = await fetchRemote();
          remoteSha = sha;
          boards = mergeBoards(rb || { general: [], founders: [] }, boards);
          remoteSha = await pushRemote(boards, remoteSha);
          dirty = false;
          localStorage.removeItem('mg_pending');
          renderAll();
          setSync('ok', 'Saved');
        } catch (e2) { console.error('[board] merge-retry failed:', e2.message); setSync('err', 'Save failed: ' + e2.message); }
      } else if (e.message.startsWith('auth')) {
        setSync('err', 'Token rejected: ' + e.message.slice(6, 60) + ' (tap to fix)');
      } else {
        setSync('err', 'Save failed: ' + e.message.slice(0, 70) + ' (tap to retry)');
      }
    } finally { isSaving = false; }
  }

  // Merge: union by id; for cards in both, prefer `local` (what this user just did)
  function mergeBoards(remote, local) {
    const out = { general: [], founders: [] };
    for (const tab of ['general', 'founders']) {
      const map = new Map();
      for (const t of (remote[tab] || [])) map.set(t.id, t);
      for (const t of (local[tab] || []))  map.set(t.id, t);
      out[tab] = Array.from(map.values());
    }
    return out;
  }

  async function loadBoards() {
    if (!ghToken()) {
      document.getElementById('token-modal').classList.add('open');
      setSync('err', 'Not connected');
      // still show cached board so it isn't blank
      const cached = localStorage.getItem('mg_boards_v1');
      boards = cached ? JSON.parse(cached) : getDefaultBoards();
      buildColumns('general'); buildColumns('founders'); renderAll();
      return;
    }

    setSync('saving', 'Loading…');
    try {
      const { boards: rb, sha } = await fetchRemote();
      remoteSha = sha;
      if (rb) {
        boards = rb;
        // recover: a previous save failed and the page was refreshed → merge local (by id, local wins) and retry
        if (localStorage.getItem('mg_pending') === '1') {
          const cached = localStorage.getItem('mg_boards_v1');
          if (cached) { boards = mergeBoards(rb, JSON.parse(cached)); dirty = true; }
        }
        // one-time: fold in any cards this browser created before shared storage existed
        if (!localStorage.getItem('mg_migrated_shared')) {
          const cached = localStorage.getItem('mg_boards_v1');
          if (cached) {
            const local = JSON.parse(cached);
            const before = countAll(boards);
            boards = mergeByTitle(boards, local);
            if (countAll(boards) !== before) { dirty = true; }
          }
          localStorage.setItem('mg_migrated_shared', '1');
        }
        applySeedUpdates();
      } else {
        // first ever run: seed the repo file
        const cached = localStorage.getItem('mg_boards_v1');
        boards = cached ? JSON.parse(cached) : getDefaultBoards();
        applySeedUpdates();
        dirty = true;
      }
      localStorage.setItem('mg_boards_v1', JSON.stringify(boards));
      buildColumns('general'); buildColumns('founders'); renderAll();
      if (dirty) await flushSave(); else setSync('ok', 'Synced');
      startPolling();
    } catch (e) {
      const cached = localStorage.getItem('mg_boards_v1');
      boards = cached ? JSON.parse(cached) : getDefaultBoards();
      buildColumns('general'); buildColumns('founders'); renderAll();
      setSync('err', e.message === 'auth' ? 'Bad token, tap to fix' : 'Offline, tap to retry');
    }
  }

  function countAll(b) { return (b.general||[]).length + (b.founders||[]).length; }

  // Migration helper: add local cards whose title isn't on the remote yet
  function mergeByTitle(remote, local) {
    const out = { general: [...(remote.general||[])], founders: [...(remote.founders||[])] };
    for (const tab of ['general', 'founders']) {
      const titles = new Set(out[tab].map(t => t.title));
      for (const t of (local[tab] || [])) {
        if (!titles.has(t.title)) { out[tab].push(t); titles.add(t.title); }
      }
    }
    return out;
  }

  function startPolling() {
    clearInterval(pollTimer);
    pollTimer = setInterval(async () => {
      if (isSaving || dirty || dragId || editId) return;
      if (document.getElementById('modal').classList.contains('open')) return;
      try {
        const { boards: rb, sha } = await fetchRemote();
        if (rb && sha !== remoteSha) {
          remoteSha = sha;
          boards = rb;
          localStorage.setItem('mg_boards_v1', JSON.stringify(boards));
          renderAll();
          setSync('ok', 'Updated');
          setTimeout(() => setSync('ok', 'Synced'), 2000);
        }
      } catch { /* ignore transient poll errors */ }
    }, POLL_MS);
  }

  // Seed updates: add new cards / move known cards, once per version (shared, so tracked in board.json)
  const SEED_VERSION = 2;
  function applySeedUpdates() {
    boards._seed = boards._seed || 1;

    const titleIn = (tab, t) => boards[tab].some(x => x.title === t);

      const t = boards[tab].find(x => x.title === title);
      if (t && t.col !== 'done') t.col = col;
    };
    const addIfMissing = (tab, card) => {
      if (!titleIn(tab, card.title)) boards[tab].unshift({ id: uid(), ...card });
    };

    moveIfExists('general', 'App rename to MoneyGator in codebase', 'done');
    moveIfExists('general', 'Codebase refactor — remove dead code', 'done');
    addIfMissing('general', { col: 'done', title: 'Plaid sandbox end-to-end: server → tunnel → app', tag: 'dev', assignee: 'P', deadline: '' });

    boards._seed = SEED_VERSION;
    dirty = true;
  }

  function buildColumns(tab) {
    const container = document.getElementById('board-' + tab);
    container.innerHTML = COLUMNS.map(col => `
      <div class="column" id="col-${tab}-${col}"

          <div class="col-title"><span class="col-dot" style="background:${COLUMN_META[col].dot}"></span>${COLUMN_META[col].label}</div>

    `).join('');
  }

  // DEADLINE HELPERS
  function deadlineStatus(dateStr) {
    if (!dateStr) return 'none';
    const today = new Date(); today.setHours(0,0,0,0);
    const due = new Date(dateStr + 'T00:00:00');
    const diff = Math.round((due - today) / 86400000);
    if (diff < 0)  return 'overdue';
    if (diff <= 5) return 'soon';
    return 'ok';
  }

  function deadlineLabel(dateStr) {
    if (!dateStr) return '';
    const today = new Date(); today.setHours(0,0,0,0);
    const due = new Date(dateStr + 'T00:00:00');
    const diff = Math.round((due - today) / 86400000);
    if (diff < 0)  return `${Math.abs(diff)}d overdue`;
    if (diff === 0) return 'Today';
    if (diff === 1) return 'Tomorrow';
    if (diff <= 30) return `${diff}d left`;
    return due.toLocaleString('en', { month: 'short', day: 'numeric' });
  }

  // RENDER
  function renderAll() {
    ['general','founders'].forEach(tab => {
      if (!Array.isArray(boards[tab])) boards[tab] = [];
      COLUMNS.forEach(col => {
        const container = document.getElementById(`cards-${tab}-${col}`);
        const colTasks = boards[tab].filter(t => t.col === col);
        document.getElementById(`count-${tab}-${col}`).textContent = colTasks.length;
        container.innerHTML = colTasks.map(t => cardHTML(t, tab)).join('');
        colTasks.forEach(t => {
          const el = document.getElementById('card-' + t.id);
          el.draggable = true;
          el.addEventListener('dragstart', () => onDragStart(t.id, tab));
          el.addEventListener('dragend', onDragEnd);
        });
      });
    });
  }

  function cardHTML(t) {
    const labels = { P: 'Pavel', T: 'Tanya', B: 'Pavel + Tanya' };
    const avatarClass = t.assignee === 'P' ? 'avatar-p' : t.assignee === 'T' ? 'avatar-t' : 'avatar-b';
    const tagLabels = { product:'Product', dev:'Dev', design:'Design', bizdev:'Biz Dev', marketing:'Marketing', legal:'Legal', finance:'Finance', strategy:'Strategy' };
    const ds = deadlineStatus(t.deadline);
    const dl = deadlineLabel(t.deadline);
    const icons = { overdue: '🔴', soon: '⚠️', ok: '📅' };
    const deadlineHTML = ds !== 'none' ? `<span class="deadline deadline-${ds}">${icons[ds]} ${dl}</span>` : '';
    return `
      <div class="card" id="card-${t.id}">
        <div class="card-top">
          <span class="card-tag tag-${t.tag}">${tagLabels[t.tag] || t.tag}</span>
          <div class="card-actions">
            <button class="card-btn" onclick="openEditModal('${t.id}')" title="Edit">✏️</button>
            <button class="card-btn delete" onclick="deleteTask('${t.id}')" title="Delete">✕</button>
          </div>
        </div>
        <div class="card-title">${t.title}</div>
        <div class="card-footer">
          <div class="card-assignee">
            <div class="avatar ${avatarClass}">${t.assignee}</div>
            ${labels[t.assignee]}
          </div>
          ${deadlineHTML}
        </div>
      </div>`;
  }

  // DRAG
  function onDragStart(id, tab) {
    dragId = { id, tab };
    setTimeout(() => document.getElementById('card-' + id)?.classList.add('dragging'), 0);
  }

  function onDragEnd() {
    document.querySelectorAll('.card').forEach(c => c.classList.remove('dragging'));
    document.querySelectorAll('.column').forEach(c => c.classList.remove('drag-over'));
  }

  function onDragOver(e) { e.preventDefault(); e.currentTarget.classList.add('drag-over'); }
  function onDragLeave(e) { e.currentTarget.classList.remove('drag-over'); }

  function onDrop(e, tab, col) {
    e.preventDefault();
    e.currentTarget.classList.remove('drag-over');
    if (!dragId || dragId.tab !== tab) { dragId = null; return; }
    const task = boards[tab].find(t => t.id === dragId.id);
    if (task) { task.col = col; saveBoards(); renderAll(); }
    dragId = null;
  }

  // MODAL
  function openModal(col) {
    editId = null;
    document.getElementById('modal-title').textContent = 'New task';
    document.getElementById('modal-save-btn').textContent = 'Add task';
    document.getElementById('f-title').value = '';
    document.getElementById('f-col').value = col || 'todo';
    document.getElementById('f-tag').value = 'product';
    document.getElementById('f-assignee').value = 'P';
    document.getElementById('f-deadline').value = '';
    document.getElementById('modal').classList.add('open');
    setTimeout(() => document.getElementById('f-title').focus(), 100);
  }

  function openEditModal(id) {
    const t = boards[currentTab].find(x => x.id === id);
    if (!t) return;
    editId = id;
    document.getElementById('modal-title').textContent = 'Edit task';
    document.getElementById('modal-save-btn').textContent = 'Save changes';
    document.getElementById('f-title').value = t.title;
    document.getElementById('f-col').value = t.col;
    document.getElementById('f-tag').value = t.tag;
    document.getElementById('f-assignee').value = t.assignee;
    document.getElementById('f-deadline').value = t.deadline || '';
    document.getElementById('modal').classList.add('open');
    setTimeout(() => document.getElementById('f-title').focus(), 100);
  }

  function closeModal() { document.getElementById('modal').classList.remove('open'); editId = null; }

  function saveTask() {
    const title = document.getElementById('f-title').value.trim();
    if (!title) { document.getElementById('f-title').focus(); return; }
    const data = {
      col:      document.getElementById('f-col').value,
      title,
      tag:      document.getElementById('f-tag').value,
      assignee: document.getElementById('f-assignee').value,
      deadline: document.getElementById('f-deadline').value,
    };
    if (editId) {
      const idx = boards[currentTab].findIndex(t => t.id === editId);
      if (idx !== -1) boards[currentTab][idx] = { ...boards[currentTab][idx], ...data };
    } else {
      boards[currentTab].unshift({ id: uid(), ...data });
    }
    saveBoards(); renderAll(); closeModal();
  }

  function deleteTask(id) {
    if (!confirm('Delete this task?')) return;
    boards[currentTab] = boards[currentTab].filter(t => t.id !== id);
    saveBoards(); renderAll();
  }

  function uid() { return Math.random().toString(36).slice(2, 10); }

  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

  // Auto-login if remembered
  (function () {
    const until = Number(localStorage.getItem('mg_login_until') || 0);
    if (until > Date.now()) enterApp();
  })();
