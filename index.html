<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MoneyGator — Board</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0F172A;
    --surface: #1E293B;
    --surface2: #263348;
    --border: #2E3F58;
    --accent: #5B4FE8;
    --accent-soft: rgba(91,79,232,0.15);
    --green: #22C55E;
    --red: #EF4444;
    --orange: #F59E0B;
    --cyan: #A5F3FC;
    --text: #F1F5F9;
    --text-muted: #64748B;
    --text-dim: #94A3B8;
    --radius: 12px;
    --radius-sm: 8px;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }

  /* LOGIN */
  #login-screen {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 24px;
  }

  .login-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 48px 40px;
    width: 100%;
    max-width: 380px;
    text-align: center;
  }

  .login-logo { font-size: 32px; margin-bottom: 8px; }
  .login-title { font-size: 22px; font-weight: 700; margin-bottom: 4px; }
  .login-sub { font-size: 14px; color: var(--text-muted); margin-bottom: 36px; }

  .login-input {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 14px 16px;
    font-size: 15px;
    color: var(--text);
    outline: none;
    margin-bottom: 12px;
    transition: border-color 0.2s;
    letter-spacing: 2px;
  }

  .login-input:focus { border-color: var(--accent); }

  .login-btn {
    width: 100%;
    background: var(--accent);
    color: white;
    border: none;
    border-radius: var(--radius-sm);
    padding: 14px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: opacity 0.2s;
  }

  .login-btn:hover { opacity: 0.88; }
  .login-error { color: var(--red); font-size: 13px; margin-top: 10px; display: none; }

  /* APP */
  #app { display: none; }

  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 24px;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
    position: sticky;
    top: 0;
    z-index: 10;
    flex-wrap: wrap;
    gap: 12px;
  }

  .topbar-left { display: flex; align-items: center; gap: 10px; }
  .topbar-logo { font-size: 22px; }
  .topbar-name { font-size: 16px; font-weight: 700; }

  .topbar-tag {
    font-size: 11px;
    background: var(--accent-soft);
    color: var(--cyan);
    border: 1px solid rgba(165,243,252,0.2);
    padding: 3px 10px;
    border-radius: 20px;
    font-weight: 500;
  }

  .topbar-right { display: flex; align-items: center; gap: 12px; }

  .add-task-btn {
    background: var(--accent);
    color: white;
    border: none;
    border-radius: var(--radius-sm);
    padding: 8px 16px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: opacity 0.2s;
  }

  .add-task-btn:hover { opacity: 0.88; }

  .logout-btn {
    background: none;
    border: 1px solid var(--border);
    color: var(--text-muted);
    border-radius: var(--radius-sm);
    padding: 8px 14px;
    font-size: 13px;
    cursor: pointer;
    transition: all 0.2s;
  }

  .logout-btn:hover { border-color: var(--text-muted); color: var(--text); }

  /* TABS */
  .tabs-bar {
    display: flex;
    gap: 8px;
    padding: 14px 24px 0 24px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
  }

  .tab-btn {
    background: none;
    border: none;
    color: var(--text-muted);
    font-size: 14px;
    font-weight: 600;
    padding: 10px 18px;
    cursor: pointer;
    border-bottom: 2px solid transparent;
    transition: all 0.2s;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .tab-btn:hover { color: var(--text); }

  .tab-btn.active {
    color: var(--text);
    border-bottom-color: var(--accent);
  }

  .tab-lock { font-size: 12px; opacity: 0.7; }

  /* BOARD */
  .board-view { display: none; }
  .board-view.active { display: block; }

  .board {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 16px;
    padding: 24px;
    min-height: calc(100vh - 118px);
  }

  .column {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px;
    min-height: 500px;
    display: flex;
    flex-direction: column;
  }

  .column.drag-over {
    border-color: var(--accent);
    background: var(--surface2);
  }

  .col-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 16px;
  }

  .col-title {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 13px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    color: var(--text-dim);
  }

  .col-dot { width: 8px; height: 8px; border-radius: 50%; }

  .col-count {
    font-size: 12px;
    color: var(--text-muted);
    background: var(--bg);
    border-radius: 20px;
    padding: 2px 8px;
    font-weight: 600;
  }

  .col-add {
    background: none;
    border: none;
    color: var(--text-muted);
    cursor: pointer;
    font-size: 18px;
    padding: 2px 6px;
    border-radius: 4px;
    transition: all 0.2s;
  }

  .col-add:hover { background: var(--bg); color: var(--text); }

  .cards { display: flex; flex-direction: column; gap: 10px; flex: 1; }

  /* CARDS */
  .card {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 14px;
    cursor: grab;
    transition: all 0.15s;
  }

  .card:hover { border-color: var(--accent); transform: translateY(-1px); }
  .card.dragging { opacity: 0.4; cursor: grabbing; }

  .card-top {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 8px;
    margin-bottom: 8px;
  }

  .card-tag {
    display: inline-block;
    font-size: 10px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    padding: 2px 8px;
    border-radius: 20px;
    white-space: nowrap;
  }

  .card-title {
    font-size: 14px;
    font-weight: 500;
    color: var(--text);
    line-height: 1.4;
    margin-bottom: 10px;
  }

  .card-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 6px;
  }

  .card-assignee {
    font-size: 11px;
    color: var(--text-muted);
    display: flex;
    align-items: center;
    gap: 4px;
  }

  .avatar {
    width: 20px;
    height: 20px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 10px;
    font-weight: 700;
    flex-shrink: 0;
  }

  .avatar-p { background: var(--accent); color: white; }
  .avatar-t { background: var(--green); color: #0F172A; }
  .avatar-b { background: var(--orange); color: #0F172A; }

  /* DEADLINE */
  .deadline {
    display: flex;
    align-items: center;
    gap: 4px;
    font-size: 11px;
    font-weight: 500;
    padding: 2px 8px;
    border-radius: 20px;
    white-space: nowrap;
  }

  .deadline-overdue { background: rgba(239,68,68,0.15); color: #FCA5A5; }
  .deadline-soon    { background: rgba(245,158,11,0.15); color: #FCD34D; }
  .deadline-ok      { background: rgba(34,197,94,0.12);  color: #86EFAC; }

  .card-actions { display: flex; align-items: center; gap: 4px; }

  .card-btn {
    background: none;
    border: none;
    color: var(--text-muted);
    cursor: pointer;
    font-size: 13px;
    padding: 3px 5px;
    border-radius: 4px;
    opacity: 0;
    transition: all 0.15s;
    line-height: 1;
  }

  .card:hover .card-btn { opacity: 1; }
  .card-btn:hover { background: var(--surface); color: var(--text); }
  .card-btn.delete:hover { color: var(--red); background: rgba(239,68,68,0.1); }

  /* MODAL */
  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.7);
    z-index: 100;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }

  .modal-overlay.open { display: flex; }

  .modal {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 28px;
    width: 100%;
    max-width: 440px;
  }

  .modal-title { font-size: 17px; font-weight: 700; margin-bottom: 20px; }

  .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

  .form-group { margin-bottom: 14px; }

  .form-label {
    display: block;
    font-size: 12px;
    font-weight: 600;
    color: var(--text-dim);
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-bottom: 6px;
  }

  .form-input, .form-select {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 11px 14px;
    font-size: 14px;
    color: var(--text);
    outline: none;
    transition: border-color 0.2s;
    font-family: inherit;
  }

  .form-input:focus, .form-select:focus { border-color: var(--accent); }
  .form-select option { background: var(--surface); }

  input[type="date"]::-webkit-calendar-picker-indicator {
    filter: invert(0.5);
    cursor: pointer;
  }

  .modal-actions { display: flex; gap: 10px; margin-top: 20px; }

  .btn-primary {
    flex: 1;
    background: var(--accent);
    color: white;
    border: none;
    border-radius: var(--radius-sm);
    padding: 12px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: opacity 0.2s;
  }

  .btn-primary:hover { opacity: 0.88; }

  .btn-secondary {
    background: none;
    border: 1px solid var(--border);
    color: var(--text-dim);
    border-radius: var(--radius-sm);
    padding: 12px 20px;
    font-size: 14px;
    cursor: pointer;
    transition: all 0.2s;
  }

  .btn-secondary:hover { border-color: var(--text-muted); color: var(--text); }

  /* TAGS */
  .tag-product   { background: rgba(91,79,232,0.2);  color: #A78BFA; }
  .tag-dev       { background: rgba(165,243,252,0.15);color: var(--cyan); }
  .tag-design    { background: rgba(249,115,22,0.2);  color: #FB923C; }
  .tag-bizdev    { background: rgba(34,197,94,0.2);   color: var(--green); }
  .tag-marketing { background: rgba(245,158,11,0.2);  color: var(--orange); }
  .tag-legal     { background: rgba(239,68,68,0.2);   color: #FCA5A5; }
  .tag-finance   { background: rgba(168,85,247,0.2);  color: #D8B4FE; }
  .tag-strategy  { background: rgba(236,72,153,0.2);  color: #F9A8D4; }

  @media (max-width: 900px) { .board { grid-template-columns: repeat(2, 1fr); } }
  @media (max-width: 540px) {
    .board { grid-template-columns: 1fr; padding: 16px; }
    .topbar { padding: 12px 16px; }
    .topbar-tag { display: none; }
    .form-row { grid-template-columns: 1fr; }
    .tabs-bar { padding: 12px 16px 0 16px; }
  }
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login-screen">
  <div class="login-card">
    <div class="login-logo">🐊</div>
    <div class="login-title">MoneyGator Board</div>
    <div class="login-sub">Enter password to access</div>
    <input type="password" class="login-input" id="pwd-input" placeholder="Password"
      onkeydown="if(event.key==='Enter')doLogin()">
    <button class="login-btn" onclick="doLogin()">Enter</button>
    <div class="login-error" id="login-error">Wrong password. Try again.</div>
  </div>
</div>

<!-- APP -->
<div id="app">
  <div class="topbar">
    <div class="topbar-left">
      <span class="topbar-logo">🐊</span>
      <span class="topbar-name">MoneyGator</span>
      <span class="topbar-tag">Team Board</span>
    </div>
    <div class="topbar-right">
      <button class="add-task-btn" onclick="openModal()">+ Add task</button>
      <button class="logout-btn" onclick="doLogout()">Log out</button>
    </div>
  </div>

  <div class="tabs-bar">
    <button class="tab-btn active" id="tab-general" onclick="switchTab('general')">General</button>
    <button class="tab-btn" id="tab-founders" onclick="switchTab('founders')">
      Founders Level <span class="tab-lock">🔒</span>
    </button>
  </div>

  <div class="board-view active" id="view-general">
    <div class="board" id="board-general"></div>
  </div>

  <div class="board-view" id="view-founders">
    <div class="board" id="board-founders"></div>
  </div>
</div>

<!-- MODAL -->
<div class="modal-overlay" id="modal" onclick="if(event.target===this)closeModal()">
  <div class="modal">
    <div class="modal-title" id="modal-title">New task</div>

    <div class="form-group">
      <label class="form-label">Title</label>
      <input type="text" class="form-input" id="f-title" placeholder="What needs to be done?">
    </div>

    <div class="form-row">
      <div class="form-group">
        <label class="form-label">Column</label>
        <select class="form-select" id="f-col">
          <option value="backlog">Backlog</option>
          <option value="todo">To Do</option>
          <option value="inprogress">In Progress</option>
          <option value="done">Done</option>
        </select>
      </div>
      <div class="form-group">
        <label class="form-label">Deadline</label>
        <input type="date" class="form-input" id="f-deadline">
      </div>
    </div>

    <div class="form-row">
      <div class="form-group">
        <label class="form-label">Area</label>
        <select class="form-select" id="f-tag">
          <option value="product">Product</option>
          <option value="dev">Dev</option>
          <option value="design">Design</option>
          <option value="bizdev">Biz Dev</option>
          <option value="marketing">Marketing</option>
          <option value="legal">Legal</option>
          <option value="finance">Finance</option>
          <option value="strategy">Strategy</option>
        </select>
      </div>
      <div class="form-group">
        <label class="form-label">Assignee</label>
        <select class="form-select" id="f-assignee">
          <option value="P">Pavel</option>
          <option value="T">Tanya</option>
          <option value="B">Both</option>
        </select>
      </div>
    </div>

    <div class="modal-actions">
      <button class="btn-secondary" onclick="closeModal()">Cancel</button>
      <button class="btn-primary" id="modal-save-btn" onclick="saveTask()">Add task</button>
    </div>
  </div>
</div>

<script>
  const PASSWORD = 'moneygator2026';
  const COLUMNS = ['backlog','todo','inprogress','done'];
  const COLUMN_META = {
    backlog:    { label: 'Backlog',     dot: '#64748B' },
    todo:       { label: 'To Do',       dot: '#F59E0B' },
    inprogress: { label: 'In Progress', dot: '#5B4FE8' },
    done:       { label: 'Done',        dot: '#22C55E' },
  };

  let boards = { general: [], founders: [] };
  let currentTab = 'general';
  let dragId = null;
  let editId = null;

  // AUTH
  function doLogin() {
    if (document.getElementById('pwd-input').value === PASSWORD) {
      document.getElementById('login-screen').style.display = 'none';
      document.getElementById('app').style.display = 'block';
      loadBoards();
    } else {
      document.getElementById('login-error').style.display = 'block';
      document.getElementById('pwd-input').value = '';
    }
  }

  function doLogout() {
    document.getElementById('login-screen').style.display = 'flex';
    document.getElementById('app').style.display = 'none';
    document.getElementById('pwd-input').value = '';
  }

  // TABS
  function switchTab(tab) {
    currentTab = tab;
    document.getElementById('tab-general').classList.toggle('active', tab === 'general');
    document.getElementById('tab-founders').classList.toggle('active', tab === 'founders');
    document.getElementById('view-general').classList.toggle('active', tab === 'general');
    document.getElementById('view-founders').classList.toggle('active', tab === 'founders');
  }

  // STORAGE
  function saveBoards() { localStorage.setItem('mg_boards_v1', JSON.stringify(boards)); }

  function loadBoards() {
    const saved = localStorage.getItem('mg_boards_v1');
    if (saved) {
      boards = JSON.parse(saved);
    } else {
      boards = getDefaultBoards();
      saveBoards();
    }
    buildColumns('general');
    buildColumns('founders');
    renderAll();
  }

  function buildColumns(tab) {
    const container = document.getElementById('board-' + tab);
    container.innerHTML = COLUMNS.map(col => `
      <div class="column" id="col-${tab}-${col}"
        ondragover="onDragOver(event)" ondrop="onDrop(event,'${tab}','${col}')" ondragleave="onDragLeave(event)">
        <div class="col-header">
          <div class="col-title"><span class="col-dot" style="background:${COLUMN_META[col].dot}"></span>${COLUMN_META[col].label}</div>
          <div style="display:flex;gap:6px;align-items:center">
            <span class="col-count" id="count-${tab}-${col}">0</span>
            <button class="col-add" onclick="openModal('${col}')">+</button>
          </div>
        </div>
        <div class="cards" id="cards-${tab}-${col}"></div>
      </div>
    `).join('');
  }

  function getDefaultBoards() {
    return {
      general: [
        { id: uid(), col: 'inprogress', title: 'Plaid integration (Stage 4)',              tag: 'dev',       assignee: 'P', deadline: '2026-10-25' },
        { id: uid(), col: 'inprogress', title: 'App rename to MoneyGator in codebase',    tag: 'dev',       assignee: 'P', deadline: '2026-08-30' },
        { id: uid(), col: 'todo',       title: 'Product Hunt launch',                      tag: 'marketing', assignee: 'P', deadline: '2026-09-10' },
        { id: uid(), col: 'todo',       title: 'Onboarding flow (Stage 3.5)',              tag: 'product',   assignee: 'P', deadline: '2026-09-20' },
        { id: uid(), col: 'todo',       title: 'Codebase refactor — remove dead code',    tag: 'dev',       assignee: 'P', deadline: '' },
        { id: uid(), col: 'todo',       title: 'Customer discovery with Aisha (ICP)',     tag: 'product',   assignee: 'B', deadline: '2026-09-05' },
        { id: uid(), col: 'backlog',    title: 'Privacy policy for App Store',            tag: 'legal',     assignee: 'T', deadline: '2026-10-01' },
        { id: uid(), col: 'backlog',    title: 'Stripe subscription billing setup',       tag: 'dev',       assignee: 'P', deadline: '' },
        { id: uid(), col: 'backlog',    title: 'TestFlight beta launch',                  tag: 'product',   assignee: 'P', deadline: '2026-10-15' },
        { id: uid(), col: 'done',       title: 'moneygator.app website launch',           tag: 'marketing', assignee: 'P', deadline: '' },
        { id: uid(), col: 'done',       title: '200+ waitlist signups',                   tag: 'marketing', assignee: 'P', deadline: '' },
      ],
      founders: [
        { id: uid(), col: 'inprogress', title: 'Plaid contract — negotiate ramp terms',   tag: 'bizdev',    assignee: 'B', deadline: '2026-09-15' },
        { id: uid(), col: 'todo',       title: 'Investor follow-ups (20 VCs)',             tag: 'bizdev',    assignee: 'P', deadline: '2026-09-01' },
        { id: uid(), col: 'todo',       title: 'MoneyGator Inc. legal entity registration',tag: 'legal',    assignee: 'T', deadline: '' },
        { id: uid(), col: 'todo',       title: 'Fundraise strategy — post Plaid signature',tag: 'strategy', assignee: 'B', deadline: '' },
        { id: uid(), col: 'backlog',    title: 'Cap table setup',                          tag: 'finance',   assignee: 'T', deadline: '' },
        { id: uid(), col: 'backlog',    title: 'Founder equity split agreement',           tag: 'legal',     assignee: 'B', deadline: '' },
        { id: uid(), col: 'done',       title: 'Pitch deck (12 slides, OpenVC format)',   tag: 'bizdev',    assignee: 'B', deadline: '' },
        { id: uid(), col: 'done',       title: 'Investor outreach — 20 VCs cold email',  tag: 'bizdev',    assignee: 'P', deadline: '' },
        { id: uid(), col: 'done',       title: 'Plaid MSA reviewed',                      tag: 'legal',     assignee: 'P', deadline: '' },
        { id: uid(), col: 'done',       title: 'OpenVC + AngelList registration',         tag: 'bizdev',    assignee: 'P', deadline: '' },
      ],
    };
  }

  // DEADLINE HELPERS
  function deadlineStatus(dateStr) {
    if (!dateStr) return 'none';
    const today = new Date(); today.setHours(0,0,0,0);
    const due = new Date(dateStr + 'T00:00:00');
    const diff = Math.round((due - today) / 86400000);
    if (diff < 0)  return 'overdue';
    if (diff <= 5) return 'soon';
    return 'ok';
  }

  function deadlineLabel(dateStr) {
    if (!dateStr) return '';
    const today = new Date(); today.setHours(0,0,0,0);
    const due = new Date(dateStr + 'T00:00:00');
    const diff = Math.round((due - today) / 86400000);
    if (diff < 0)  return `${Math.abs(diff)}d overdue`;
    if (diff === 0) return 'Today';
    if (diff === 1) return 'Tomorrow';
    if (diff <= 30) return `${diff}d left`;
    return due.toLocaleString('en', { month: 'short', day: 'numeric' });
  }

  // RENDER
  function renderAll() {
    ['general','founders'].forEach(tab => {
      COLUMNS.forEach(col => {
        const container = document.getElementById(`cards-${tab}-${col}`);
        const colTasks = boards[tab].filter(t => t.col === col);
        document.getElementById(`count-${tab}-${col}`).textContent = colTasks.length;
        container.innerHTML = colTasks.map(t => cardHTML(t, tab)).join('');
        colTasks.forEach(t => {
          const el = document.getElementById('card-' + t.id);
          el.draggable = true;
          el.addEventListener('dragstart', () => onDragStart(t.id, tab));
          el.addEventListener('dragend', onDragEnd);
        });
      });
    });
  }

  function cardHTML(t) {
    const labels = { P: 'Pavel', T: 'Tanya', B: 'Pavel + Tanya' };
    const avatarClass = t.assignee === 'P' ? 'avatar-p' : t.assignee === 'T' ? 'avatar-t' : 'avatar-b';
    const tagLabels = { product:'Product', dev:'Dev', design:'Design', bizdev:'Biz Dev', marketing:'Marketing', legal:'Legal', finance:'Finance', strategy:'Strategy' };
    const ds = deadlineStatus(t.deadline);
    const dl = deadlineLabel(t.deadline);
    const icons = { overdue: '🔴', soon: '⚠️', ok: '📅' };
    const deadlineHTML = ds !== 'none' ? `<span class="deadline deadline-${ds}">${icons[ds]} ${dl}</span>` : '';
    return `
      <div class="card" id="card-${t.id}">
        <div class="card-top">
          <span class="card-tag tag-${t.tag}">${tagLabels[t.tag] || t.tag}</span>
          <div class="card-actions">
            <button class="card-btn" onclick="openEditModal('${t.id}')" title="Edit">✏️</button>
            <button class="card-btn delete" onclick="deleteTask('${t.id}')" title="Delete">✕</button>
          </div>
        </div>
        <div class="card-title">${t.title}</div>
        <div class="card-footer">
          <div class="card-assignee">
            <div class="avatar ${avatarClass}">${t.assignee}</div>
            ${labels[t.assignee]}
          </div>
          ${deadlineHTML}
        </div>
      </div>`;
  }

  // DRAG
  function onDragStart(id, tab) {
    dragId = { id, tab };
    setTimeout(() => document.getElementById('card-' + id)?.classList.add('dragging'), 0);
  }

  function onDragEnd() {
    document.querySelectorAll('.card').forEach(c => c.classList.remove('dragging'));
    document.querySelectorAll('.column').forEach(c => c.classList.remove('drag-over'));
  }

  function onDragOver(e) { e.preventDefault(); e.currentTarget.classList.add('drag-over'); }
  function onDragLeave(e) { e.currentTarget.classList.remove('drag-over'); }

  function onDrop(e, tab, col) {
    e.preventDefault();
    e.currentTarget.classList.remove('drag-over');
    if (!dragId || dragId.tab !== tab) { dragId = null; return; }
    const task = boards[tab].find(t => t.id === dragId.id);
    if (task) { task.col = col; saveBoards(); renderAll(); }
    dragId = null;
  }

  // MODAL
  function openModal(col) {
    editId = null;
    document.getElementById('modal-title').textContent = 'New task';
    document.getElementById('modal-save-btn').textContent = 'Add task';
    document.getElementById('f-title').value = '';
    document.getElementById('f-col').value = col || 'todo';
    document.getElementById('f-tag').value = 'product';
    document.getElementById('f-assignee').value = 'P';
    document.getElementById('f-deadline').value = '';
    document.getElementById('modal').classList.add('open');
    setTimeout(() => document.getElementById('f-title').focus(), 100);
  }

  function openEditModal(id) {
    const t = boards[currentTab].find(x => x.id === id);
    if (!t) return;
    editId = id;
    document.getElementById('modal-title').textContent = 'Edit task';
    document.getElementById('modal-save-btn').textContent = 'Save changes';
    document.getElementById('f-title').value = t.title;
    document.getElementById('f-col').value = t.col;
    document.getElementById('f-tag').value = t.tag;
    document.getElementById('f-assignee').value = t.assignee;
    document.getElementById('f-deadline').value = t.deadline || '';
    document.getElementById('modal').classList.add('open');
    setTimeout(() => document.getElementById('f-title').focus(), 100);
  }

  function closeModal() { document.getElementById('modal').classList.remove('open'); editId = null; }

  function saveTask() {
    const title = document.getElementById('f-title').value.trim();
    if (!title) { document.getElementById('f-title').focus(); return; }
    const data = {
      col:      document.getElementById('f-col').value,
      title,
      tag:      document.getElementById('f-tag').value,
      assignee: document.getElementById('f-assignee').value,
      deadline: document.getElementById('f-deadline').value,
    };
    if (editId) {
      const idx = boards[currentTab].findIndex(t => t.id === editId);
      if (idx !== -1) boards[currentTab][idx] = { ...boards[currentTab][idx], ...data };
    } else {
      boards[currentTab].unshift({ id: uid(), ...data });
    }
    saveBoards(); renderAll(); closeModal();
  }

  function deleteTask(id) {
    if (!confirm('Delete this task?')) return;
    boards[currentTab] = boards[currentTab].filter(t => t.id !== id);
    saveBoards(); renderAll();
  }

  function uid() { return Math.random().toString(36).slice(2, 10); }

  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });
</script>
</body>
</html>
