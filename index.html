<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MoneyGator — Board</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0F172A;
    --surface: #1E293B;
    --surface2: #263348;
    --border: #2E3F58;
    --accent: #5B4FE8;
    --accent-soft: rgba(91,79,232,0.15);
    --green: #22C55E;
    --red: #EF4444;
    --orange: #F59E0B;
    --cyan: #A5F3FC;
    --text: #F1F5F9;
    --text-muted: #64748B;
    --text-dim: #94A3B8;
    --radius: 12px;
    --radius-sm: 8px;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }

  /* LOGIN */
  #login-screen {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 24px;
  }

  .login-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 48px 40px;
    width: 100%;
    max-width: 380px;
    text-align: center;
  }

  .login-logo {
    font-size: 32px;
    margin-bottom: 8px;
  }

  .login-title {
    font-size: 22px;
    font-weight: 700;
    margin-bottom: 4px;
  }

  .login-sub {
    font-size: 14px;
    color: var(--text-muted);
    margin-bottom: 36px;
  }

  .login-input {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 14px 16px;
    font-size: 15px;
    color: var(--text);
    outline: none;
    margin-bottom: 12px;
    transition: border-color 0.2s;
    letter-spacing: 2px;
  }

  .login-input:focus { border-color: var(--accent); }

  .login-btn {
    width: 100%;
    background: var(--accent);
    color: white;
    border: none;
    border-radius: var(--radius-sm);
    padding: 14px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: opacity 0.2s;
  }

  .login-btn:hover { opacity: 0.88; }

  .login-error {
    color: var(--red);
    font-size: 13px;
    margin-top: 10px;
    display: none;
  }

  /* APP */
  #app { display: none; }

  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 24px;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
    position: sticky;
    top: 0;
    z-index: 10;
  }

  .topbar-left {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .topbar-logo { font-size: 22px; }

  .topbar-name {
    font-size: 16px;
    font-weight: 700;
    color: var(--text);
  }

  .topbar-tag {
    font-size: 11px;
    background: var(--accent-soft);
    color: var(--cyan);
    border: 1px solid rgba(165,243,252,0.2);
    padding: 3px 10px;
    border-radius: 20px;
    font-weight: 500;
  }

  .topbar-right {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .add-task-btn {
    background: var(--accent);
    color: white;
    border: none;
    border-radius: var(--radius-sm);
    padding: 8px 16px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 6px;
    transition: opacity 0.2s;
  }

  .add-task-btn:hover { opacity: 0.88; }

  .logout-btn {
    background: none;
    border: 1px solid var(--border);
    color: var(--text-muted);
    border-radius: var(--radius-sm);
    padding: 8px 14px;
    font-size: 13px;
    cursor: pointer;
    transition: all 0.2s;
  }

  .logout-btn:hover { border-color: var(--text-muted); color: var(--text); }

  /* BOARD */
  .board {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 16px;
    padding: 24px;
    min-height: calc(100vh - 65px);
    overflow-x: auto;
  }

  .column {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px;
    min-height: 500px;
    display: flex;
    flex-direction: column;
  }

  .column.drag-over {
    border-color: var(--accent);
    background: var(--surface2);
  }

  .col-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 16px;
  }

  .col-title {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 13px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    color: var(--text-dim);
  }

  .col-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
  }

  .col-count {
    font-size: 12px;
    color: var(--text-muted);
    background: var(--bg);
    border-radius: 20px;
    padding: 2px 8px;
    font-weight: 600;
  }

  .col-add {
    background: none;
    border: none;
    color: var(--text-muted);
    cursor: pointer;
    font-size: 18px;
    line-height: 1;
    padding: 2px 6px;
    border-radius: 4px;
    transition: all 0.2s;
  }

  .col-add:hover { background: var(--bg); color: var(--text); }

  .cards {
    display: flex;
    flex-direction: column;
    gap: 10px;
    flex: 1;
  }

  /* CARDS */
  .card {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 14px;
    cursor: grab;
    transition: all 0.15s;
    position: relative;
  }

  .card:hover {
    border-color: var(--accent);
    transform: translateY(-1px);
  }

  .card.dragging {
    opacity: 0.4;
    cursor: grabbing;
  }

  .card-tag {
    display: inline-block;
    font-size: 10px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    padding: 2px 8px;
    border-radius: 20px;
    margin-bottom: 8px;
  }

  .card-title {
    font-size: 14px;
    font-weight: 500;
    color: var(--text);
    line-height: 1.4;
    margin-bottom: 10px;
  }

  .card-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .card-assignee {
    font-size: 11px;
    color: var(--text-muted);
    display: flex;
    align-items: center;
    gap: 4px;
  }

  .avatar {
    width: 20px;
    height: 20px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 10px;
    font-weight: 700;
  }

  .avatar-p { background: var(--accent); color: white; }
  .avatar-t { background: var(--green); color: #0F172A; }
  .avatar-b { background: var(--orange); color: #0F172A; }

  .card-delete {
    background: none;
    border: none;
    color: var(--text-muted);
    cursor: pointer;
    font-size: 14px;
    padding: 2px 4px;
    border-radius: 4px;
    opacity: 0;
    transition: all 0.15s;
  }

  .card:hover .card-delete { opacity: 1; }
  .card-delete:hover { color: var(--red); background: rgba(239,68,68,0.1); }

  /* MODAL */
  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.7);
    z-index: 100;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }

  .modal-overlay.open { display: flex; }

  .modal {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 28px;
    width: 100%;
    max-width: 440px;
  }

  .modal-title {
    font-size: 17px;
    font-weight: 700;
    margin-bottom: 20px;
  }

  .form-group {
    margin-bottom: 16px;
  }

  .form-label {
    display: block;
    font-size: 12px;
    font-weight: 600;
    color: var(--text-dim);
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-bottom: 8px;
  }

  .form-input, .form-select, .form-textarea {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 11px 14px;
    font-size: 14px;
    color: var(--text);
    outline: none;
    transition: border-color 0.2s;
    font-family: inherit;
  }

  .form-textarea { resize: vertical; min-height: 80px; }
  .form-input:focus, .form-select:focus, .form-textarea:focus { border-color: var(--accent); }
  .form-select option { background: var(--surface); }

  .modal-actions {
    display: flex;
    gap: 10px;
    margin-top: 20px;
  }

  .btn-primary {
    flex: 1;
    background: var(--accent);
    color: white;
    border: none;
    border-radius: var(--radius-sm);
    padding: 12px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: opacity 0.2s;
  }

  .btn-primary:hover { opacity: 0.88; }

  .btn-secondary {
    background: none;
    border: 1px solid var(--border);
    color: var(--text-dim);
    border-radius: var(--radius-sm);
    padding: 12px 20px;
    font-size: 14px;
    cursor: pointer;
    transition: all 0.2s;
  }

  .btn-secondary:hover { border-color: var(--text-muted); color: var(--text); }

  /* TAGS */
  .tag-product { background: rgba(91,79,232,0.2); color: #A78BFA; }
  .tag-dev { background: rgba(165,243,252,0.15); color: var(--cyan); }
  .tag-design { background: rgba(249,115,22,0.2); color: #FB923C; }
  .tag-bizdev { background: rgba(34,197,94,0.2); color: var(--green); }
  .tag-marketing { background: rgba(245,158,11,0.2); color: var(--orange); }
  .tag-legal { background: rgba(239,68,68,0.2); color: #FCA5A5; }

  @media (max-width: 900px) {
    .board { grid-template-columns: repeat(2, 1fr); }
  }

  @media (max-width: 540px) {
    .board { grid-template-columns: 1fr; padding: 16px; }
    .topbar { padding: 12px 16px; }
    .topbar-tag { display: none; }
  }
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login-screen">
  <div class="login-card">
    <div class="login-logo">🐊</div>
    <div class="login-title">MoneyGator Board</div>
    <div class="login-sub">Enter password to access</div>
    <input type="password" class="login-input" id="pwd-input" placeholder="Password" onkeydown="if(event.key==='Enter')doLogin()">
    <button class="login-btn" onclick="doLogin()">Enter</button>
    <div class="login-error" id="login-error">Wrong password. Try again.</div>
  </div>
</div>

<!-- APP -->
<div id="app">
  <div class="topbar">
    <div class="topbar-left">
      <span class="topbar-logo">🐊</span>
      <span class="topbar-name">MoneyGator</span>
      <span class="topbar-tag">Team Board</span>
    </div>
    <div class="topbar-right">
      <button class="add-task-btn" onclick="openModal()">+ Add task</button>
      <button class="logout-btn" onclick="doLogout()">Log out</button>
    </div>
  </div>

  <div class="board">
    <div class="column" id="col-backlog" ondragover="onDragOver(event)" ondrop="onDrop(event,'backlog')" ondragleave="onDragLeave(event)">
      <div class="col-header">
        <div class="col-title">
          <span class="col-dot" style="background:#64748B"></span>
          Backlog
        </div>
        <div style="display:flex;gap:6px;align-items:center">
          <span class="col-count" id="count-backlog">0</span>
          <button class="col-add" onclick="openModal('backlog')" title="Add task">+</button>
        </div>
      </div>
      <div class="cards" id="cards-backlog"></div>
    </div>

    <div class="column" id="col-todo" ondragover="onDragOver(event)" ondrop="onDrop(event,'todo')" ondragleave="onDragLeave(event)">
      <div class="col-header">
        <div class="col-title">
          <span class="col-dot" style="background:#F59E0B"></span>
          To Do
        </div>
        <div style="display:flex;gap:6px;align-items:center">
          <span class="col-count" id="count-todo">0</span>
          <button class="col-add" onclick="openModal('todo')" title="Add task">+</button>
        </div>
      </div>
      <div class="cards" id="cards-todo"></div>
    </div>

    <div class="column" id="col-inprogress" ondragover="onDragOver(event)" ondrop="onDrop(event,'inprogress')" ondragleave="onDragLeave(event)">
      <div class="col-header">
        <div class="col-title">
          <span class="col-dot" style="background:#5B4FE8"></span>
          In Progress
        </div>
        <div style="display:flex;gap:6px;align-items:center">
          <span class="col-count" id="count-inprogress">0</span>
          <button class="col-add" onclick="openModal('inprogress')" title="Add task">+</button>
        </div>
      </div>
      <div class="cards" id="cards-inprogress"></div>
    </div>

    <div class="column" id="col-done" ondragover="onDragOver(event)" ondrop="onDrop(event,'done')" ondragleave="onDragLeave(event)">
      <div class="col-header">
        <div class="col-title">
          <span class="col-dot" style="background:#22C55E"></span>
          Done
        </div>
        <div style="display:flex;gap:6px;align-items:center">
          <span class="col-count" id="count-done">0</span>
          <button class="col-add" onclick="openModal('done')" title="Add task">+</button>
        </div>
      </div>
      <div class="cards" id="cards-done"></div>
    </div>
  </div>
</div>

<!-- MODAL -->
<div class="modal-overlay" id="modal" onclick="if(event.target===this)closeModal()">
  <div class="modal">
    <div class="modal-title">New task</div>
    <div class="form-group">
      <label class="form-label">Title</label>
      <input type="text" class="form-input" id="f-title" placeholder="What needs to be done?">
    </div>
    <div class="form-group">
      <label class="form-label">Column</label>
      <select class="form-select" id="f-col">
        <option value="backlog">Backlog</option>
        <option value="todo">To Do</option>
        <option value="inprogress">In Progress</option>
        <option value="done">Done</option>
      </select>
    </div>
    <div class="form-group">
      <label class="form-label">Area</label>
      <select class="form-select" id="f-tag">
        <option value="product">Product</option>
        <option value="dev">Dev</option>
        <option value="design">Design</option>
        <option value="bizdev">Biz Dev</option>
        <option value="marketing">Marketing</option>
        <option value="legal">Legal</option>
      </select>
    </div>
    <div class="form-group">
      <label class="form-label">Assignee</label>
      <select class="form-select" id="f-assignee">
        <option value="P">Pavel</option>
        <option value="T">Tanya</option>
        <option value="B">Both</option>
      </select>
    </div>
    <div class="modal-actions">
      <button class="btn-secondary" onclick="closeModal()">Cancel</button>
      <button class="btn-primary" onclick="addTask()">Add task</button>
    </div>
  </div>
</div>

<script>
  // CONFIG — change password here
  const PASSWORD = 'moneygator2026';

  // STATE
  let tasks = [];
  let dragId = null;

  // AUTH
  function doLogin() {
    const val = document.getElementById('pwd-input').value;
    if (val === PASSWORD) {
      document.getElementById('login-screen').style.display = 'none';
      document.getElementById('app').style.display = 'block';
      loadTasks();
    } else {
      document.getElementById('login-error').style.display = 'block';
      document.getElementById('pwd-input').value = '';
    }
  }

  function doLogout() {
    document.getElementById('login-screen').style.display = 'flex';
    document.getElementById('app').style.display = 'none';
    document.getElementById('pwd-input').value = '';
  }

  // STORAGE
  function saveTasks() {
    localStorage.setItem('mg_tasks', JSON.stringify(tasks));
  }

  function loadTasks() {
    const saved = localStorage.getItem('mg_tasks');
    if (saved) {
      tasks = JSON.parse(saved);
    } else {
      tasks = getDefaultTasks();
      saveTasks();
    }
    renderAll();
  }

  function getDefaultTasks() {
    return [
      { id: uid(), col: 'inprogress', title: 'Plaid contract — negotiate ramp terms', tag: 'bizdev', assignee: 'B' },
      { id: uid(), col: 'inprogress', title: 'Plaid integration (Stage 4)', tag: 'dev', assignee: 'P' },
      { id: uid(), col: 'inprogress', title: 'App rename to MoneyGator in codebase', tag: 'dev', assignee: 'P' },
      { id: uid(), col: 'todo', title: 'Product Hunt launch', tag: 'marketing', assignee: 'P' },
      { id: uid(), col: 'todo', title: 'Investor follow-ups (20 VCs)', tag: 'bizdev', assignee: 'P' },
      { id: uid(), col: 'todo', title: 'Onboarding flow (Stage 3.5)', tag: 'product', assignee: 'P' },
      { id: uid(), col: 'todo', title: 'Codebase refactor — remove dead code', tag: 'dev', assignee: 'P' },
      { id: uid(), col: 'todo', title: 'Customer discovery with Aisha (ICP)', tag: 'product', assignee: 'B' },
      { id: uid(), col: 'backlog', title: 'Privacy policy for App Store', tag: 'legal', assignee: 'T' },
      { id: uid(), col: 'backlog', title: 'Stripe subscription billing setup', tag: 'dev', assignee: 'P' },
      { id: uid(), col: 'backlog', title: 'TestFlight beta launch', tag: 'product', assignee: 'P' },
      { id: uid(), col: 'backlog', title: 'MoneyGator Inc. legal entity registration', tag: 'legal', assignee: 'T' },
      { id: uid(), col: 'done', title: 'Pitch deck (12 slides, OpenVC format)', tag: 'bizdev', assignee: 'B' },
      { id: uid(), col: 'done', title: 'moneygator.app website launch', tag: 'marketing', assignee: 'P' },
      { id: uid(), col: 'done', title: '200+ waitlist signups', tag: 'marketing', assignee: 'P' },
      { id: uid(), col: 'done', title: 'Investor outreach — 20 VCs cold email', tag: 'bizdev', assignee: 'P' },
      { id: uid(), col: 'done', title: 'Plaid MSA signed', tag: 'legal', assignee: 'P' },
      { id: uid(), col: 'done', title: 'OpenVC + AngelList registration', tag: 'bizdev', assignee: 'P' },
    ];
  }

  // RENDER
  function renderAll() {
    ['backlog','todo','inprogress','done'].forEach(col => {
      const container = document.getElementById('cards-' + col);
      const colTasks = tasks.filter(t => t.col === col);
      document.getElementById('count-' + col).textContent = colTasks.length;
      container.innerHTML = colTasks.map(t => cardHTML(t)).join('');
      colTasks.forEach(t => {
        const el = document.getElementById('card-' + t.id);
        el.draggable = true;
        el.addEventListener('dragstart', () => onDragStart(t.id));
        el.addEventListener('dragend', onDragEnd);
      });
    });
  }

  function cardHTML(t) {
    const labels = { P: 'Pavel', T: 'Tanya', B: 'Pavel + Tanya' };
    const avatarClass = t.assignee === 'P' ? 'avatar-p' : t.assignee === 'T' ? 'avatar-t' : 'avatar-b';
    const avatarLetter = t.assignee === 'B' ? 'B' : t.assignee;
    const tagLabels = { product: 'Product', dev: 'Dev', design: 'Design', bizdev: 'Biz Dev', marketing: 'Marketing', legal: 'Legal' };
    return `
      <div class="card" id="card-${t.id}">
        <span class="card-tag tag-${t.tag}">${tagLabels[t.tag] || t.tag}</span>
        <div class="card-title">${t.title}</div>
        <div class="card-footer">
          <div class="card-assignee">
            <div class="avatar ${avatarClass}">${avatarLetter}</div>
            ${labels[t.assignee]}
          </div>
          <button class="card-delete" onclick="deleteTask('${t.id}')" title="Delete">✕</button>
        </div>
      </div>`;
  }

  // DRAG
  function onDragStart(id) {
    dragId = id;
    setTimeout(() => document.getElementById('card-' + id)?.classList.add('dragging'), 0);
  }

  function onDragEnd() {
    document.querySelectorAll('.card').forEach(c => c.classList.remove('dragging'));
    document.querySelectorAll('.column').forEach(c => c.classList.remove('drag-over'));
  }

  function onDragOver(e) {
    e.preventDefault();
    e.currentTarget.classList.add('drag-over');
  }

  function onDragLeave(e) {
    e.currentTarget.classList.remove('drag-over');
  }

  function onDrop(e, col) {
    e.preventDefault();
    e.currentTarget.classList.remove('drag-over');
    if (!dragId) return;
    const task = tasks.find(t => t.id === dragId);
    if (task) { task.col = col; saveTasks(); renderAll(); }
    dragId = null;
  }

  // MODAL
  let defaultCol = 'todo';

  function openModal(col) {
    defaultCol = col || 'todo';
    document.getElementById('f-col').value = defaultCol;
    document.getElementById('f-title').value = '';
    document.getElementById('modal').classList.add('open');
    setTimeout(() => document.getElementById('f-title').focus(), 100);
  }

  function closeModal() {
    document.getElementById('modal').classList.remove('open');
  }

  function addTask() {
    const title = document.getElementById('f-title').value.trim();
    if (!title) { document.getElementById('f-title').focus(); return; }
    tasks.unshift({
      id: uid(),
      col: document.getElementById('f-col').value,
      title,
      tag: document.getElementById('f-tag').value,
      assignee: document.getElementById('f-assignee').value,
    });
    saveTasks();
    renderAll();
    closeModal();
  }

  function deleteTask(id) {
    if (!confirm('Delete this task?')) return;
    tasks = tasks.filter(t => t.id !== id);
    saveTasks();
    renderAll();
  }

  // UTILS
  function uid() {
    return Math.random().toString(36).slice(2, 10);
  }

  // KEYBOARD
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') closeModal();
  });
</script>
</body>
</html>
